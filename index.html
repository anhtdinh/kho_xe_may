<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5f56">
<meta name="mobile-web-app-capable" content="yes">
<title>Kho xe máy</title>
<style>
:root{
  --bg:#eef1ef; --card:#ffffff; --ink:#17211f; --mute:#5d6b67; --line:#d3dbd8;
  --pri:#0f5f56; --pri-ink:#ffffff; --warn:#8a5a00; --warn-bg:#fff3d6;
  --err:#a8201a; --err-bg:#fde8e6; --ok:#17603a; --ok-bg:#e1f3e8;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
body{padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
header{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;background:var(--pri);color:var(--pri-ink)}
header h1{margin:0;font-size:19px;font-weight:700}
header button{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:8px;padding:6px 12px;font-size:14px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--pri)}
.tabs button{padding:13px 0;border:0;background:transparent;color:rgba(255,255,255,.75);font-size:16px;font-weight:600;border-bottom:4px solid transparent}
.tabs button.on{color:#fff;border-bottom-color:#fff}
main{max-width:560px;margin:0 auto;padding:14px}
.step{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.step.done{border-color:var(--pri)}
.step h2{margin:0 0 8px;font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.step h2 .tick{color:var(--pri);font-weight:700;font-size:14px}
.row{display:flex;gap:8px}
input[type=text]{flex:1;min-width:0;padding:12px;border:1px solid var(--line);border-radius:8px;font-size:17px;background:#fff;color:var(--ink)}
input[type=text]:focus{outline:3px solid #8ccbc2;border-color:var(--pri)}
button.act{padding:12px 16px;border-radius:8px;border:0;background:var(--pri);color:#fff;font-size:16px;font-weight:600;white-space:nowrap}
button.act.alt{background:#fff;color:var(--pri);border:1.5px solid var(--pri)}
button.big{width:100%;padding:16px;font-size:18px;border-radius:10px;border:0;background:var(--pri);color:#fff;font-weight:700}
button:disabled{opacity:.4}
button:focus-visible{outline:3px solid #8ccbc2;outline-offset:2px}
.preview{margin-top:10px;width:100%;max-height:260px;object-fit:contain;border-radius:8px;background:#e5eae8;display:none}
.preview.show{display:block}
.msg{padding:11px 12px;border-radius:8px;margin:0 0 12px;font-size:15px;display:none}
.msg.show{display:block}
.msg.err{background:var(--err-bg);color:var(--err)}
.msg.ok{background:var(--ok-bg);color:var(--ok)}
.msg.warn{background:var(--warn-bg);color:var(--warn)}
.info{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px;margin-top:10px}
.info dt{color:var(--mute)} .info dd{margin:0;font-weight:600;word-break:break-all}
label.lbl{display:block;font-size:14px;color:var(--mute);margin:10px 0 4px}
.recent h3{font-size:14px;margin:18px 2px 6px;color:var(--mute);font-weight:600}
.recent ul{list-style:none;margin:0;padding:0}
.recent li{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin-bottom:6px;font-size:14px;display:flex;gap:10px;align-items:baseline}
.recent li b{min-width:44px}
.recent li span{word-break:break-all}
#scanner{position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column}
#scanner[hidden]{display:none}
#reader{flex:1;min-height:0;overflow:hidden}
#reader video{width:100%!important;height:100%!important;object-fit:cover}
#scanBar{padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:#111;color:#fff;display:flex;gap:12px;align-items:center;justify-content:space-between}
#scanHint{margin:0;font-size:15px}
#scanCancel{padding:10px 18px;border-radius:8px;border:1px solid #fff;background:transparent;color:#fff;font-size:16px}
dialog{border:0;border-radius:12px;padding:18px;width:min(92vw,420px)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h2{margin:0 0 4px;font-size:18px}
dialog p.hint{margin:0 0 6px;color:var(--mute);font-size:14px}
.dlgrow{display:flex;gap:8px;margin-top:16px}
.dlgrow button{flex:1}
[hidden]{display:none!important}
</style>
</head>
<body>

<header>
  <h1>Kho xe máy</h1>
  <button id="btnSettings">Cài đặt</button>
</header>
<nav class="tabs">
  <button id="tabIn" class="on">Nhập kho</button>
  <button id="tabOut">Xuất kho</button>
</nav>

<main>
  <div id="msg" class="msg" role="status"></div>

  <!-- NHẬP KHO -->
  <section id="viewIn">
    <div class="step" id="sQr">
      <h2>Tem QR của xe <span class="tick" id="tQr"></span></h2>
      <div class="row">
        <input type="text" id="inQr" placeholder="Quét hoặc gõ mã" autocomplete="off" autocapitalize="characters">
        <button class="act" id="scanQr">Quét</button>
      </div>
    </div>

    <div class="step" id="sVin">
      <h2>Tem số khung <span class="tick" id="tVin"></span></h2>
      <div class="row">
        <input type="text" id="inVin" placeholder="Quét hoặc gõ số khung" autocomplete="off" autocapitalize="characters">
        <button class="act" id="scanVin">Quét</button>
      </div>
    </div>

    <div class="step" id="sPhoto">
      <h2>Ảnh số khung trên xe <span class="tick" id="tPhoto"></span></h2>
      <button class="act alt" id="shootIn" style="width:100%">Chụp ảnh</button>
      <img class="preview" id="prevIn" alt="Ảnh số khung">
    </div>

    <button class="big" id="saveIn" disabled>Lưu nhập kho</button>
  </section>

  <!-- XUẤT KHO -->
  <section id="viewOut" hidden>
    <div class="step" id="sQrOut">
      <h2>Tem QR của xe <span class="tick" id="tQrOut"></span></h2>
      <div class="row">
        <input type="text" id="outQr" placeholder="Quét hoặc gõ mã" autocomplete="off" autocapitalize="characters">
        <button class="act" id="scanOut">Quét</button>
      </div>
      <dl class="info" id="outInfo" hidden>
        <dt>Số khung</dt><dd id="oVin"></dd>
        <dt>Trạng thái</dt><dd id="oStatus"></dd>
        <dt>Ngày nhập</dt><dd id="oDate"></dd>
      </dl>
    </div>

    <div class="step">
      <h2>Ghi chú xuất (khách, container, ...)</h2>
      <input type="text" id="outNote" placeholder="Không bắt buộc" autocomplete="off" style="width:100%">
      <label class="lbl">Ảnh lúc xuất (không bắt buộc)</label>
      <button class="act alt" id="shootOut" style="width:100%">Chụp ảnh</button>
      <img class="preview" id="prevOut" alt="Ảnh lúc xuất">
    </div>

    <button class="big" id="saveOut" disabled>Xác nhận xuất kho</button>
  </section>

  <div class="recent" id="recent" hidden>
    <h3>Vừa lưu trên máy này</h3>
    <ul id="recentList"></ul>
  </div>
</main>

<!-- Máy quét -->
<div id="scanner" hidden>
  <div id="reader"></div>
  <div id="scanBar">
    <p id="scanHint"></p>
    <button id="scanCancel">Đóng</button>
  </div>
</div>

<!-- Cài đặt -->
<dialog id="settings">
  <h2>Cài đặt</h2>
  <p class="hint">Chỉ cần nhập một lần, lưu trên máy này.</p>
  <label class="lbl" for="cfgUrl">Link Web App (Apps Script)</label>
  <input type="text" id="cfgUrl" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off" style="width:100%">
  <label class="lbl" for="cfgSecret">Mật khẩu app</label>
  <input type="text" id="cfgSecret" autocomplete="off" style="width:100%">
  <label class="lbl" for="cfgUser">Tên người thao tác</label>
  <input type="text" id="cfgUser" autocomplete="off" style="width:100%">
  <div class="dlgrow">
    <button class="act alt" id="cfgTest">Thử kết nối</button>
    <button class="act" id="cfgSave">Lưu</button>
  </div>
  <p class="hint" id="cfgMsg" style="margin-top:10px"></p>
</dialog>

<input type="file" id="file" accept="image/*" capture="environment" hidden>

<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
(function(){
  const $ = s => document.querySelector(s);
  const store = {
    get(k){ try{ return localStorage.getItem(k) || ''; }catch(e){ return ''; } },
    set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  };

  /* ---------- thông báo ---------- */
  function showMsg(text, kind){
    const m = $('#msg');
    m.className = 'msg show ' + (kind || 'ok');
    m.textContent = text;
    if (kind !== 'err') setTimeout(()=>{ if (m.textContent === text) m.className = 'msg'; }, 4000);
    window.scrollTo({top:0, behavior:'smooth'});
  }
  function clearMsg(){ $('#msg').className = 'msg'; }

  /* ---------- gọi backend ---------- */
  async function api(payload){
    const url = store.get('url');
    if (!url) throw new Error('Chưa cài link Web App. Bấm Cài đặt để nhập.');
    const body = JSON.stringify(Object.assign({}, payload, {secret: store.get('secret'), user: store.get('user')}));
    // Không đặt Content-Type để trình duyệt gửi dạng text/plain (tránh preflight CORS)
    const r = await fetch(url, {method:'POST', body});
    const data = await r.json();
    return data;
  }

  /* ---------- quét mã ---------- */
  let scanner = null;
  function scan(hint){
    return new Promise(async resolve => {
      const ov = $('#scanner');
      $('#scanHint').textContent = hint;
      ov.hidden = false;
      let finished = false;
      const f = Html5QrcodeSupportedFormats;
      scanner = new Html5Qrcode('reader', {
        formatsToSupport: [f.QR_CODE, f.CODE_128, f.CODE_39, f.DATA_MATRIX, f.EAN_13],
        experimentalFeatures: {useBarCodeDetectorIfSupported: true},
        verbose: false
      });
      const s = scanner;
      const finish = async val => {
        if (finished) return;
        finished = true;
        try{ await s.stop(); }catch(e){}
        try{ s.clear(); }catch(e){}
        ov.hidden = true;
        resolve(val);
      };
      $('#scanCancel').onclick = () => finish(null);
      try{
        await s.start(
          {facingMode:'environment'},
          {fps:10, qrbox:(w,h)=>{ const x = Math.floor(Math.min(w,h)*0.8); return {width:x, height:Math.floor(x*0.8)}; }},
          text => { if (navigator.vibrate) navigator.vibrate(60); finish(text); },
          () => {}
        );
      }catch(err){
        showMsg('Không mở được camera: ' + err + '. Kiểm tra quyền camera và đảm bảo trang chạy bằng https.', 'err');
        finish(null);
      }
    });
  }

  /* ---------- chụp ảnh + nén ---------- */
  function pickPhoto(){
    return new Promise(resolve => {
      const inp = $('#file');
      inp.value = '';
      inp.onchange = () => {
        const file = inp.files && inp.files[0];
        if (!file) return resolve(null);
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          const max = 1600;
          const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
          const c = document.createElement('canvas');
          c.width = Math.round(img.naturalWidth * k);
          c.height = Math.round(img.naturalHeight * k);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          URL.revokeObjectURL(url);
          resolve(c.toDataURL('image/jpeg', 0.82));
        };
        img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
        img.src = url;
      };
      inp.click();
    });
  }

  /* ---------- trạng thái ---------- */
  let mode = 'in';
  let photoIn = '', photoOut = '';
  let outRecord = null; // kết quả tra cứu

  const norm = v => String(v || '').trim();

  function refreshIn(){
    const qr = norm($('#inQr').value), vin = norm($('#inVin').value);
    $('#tQr').textContent = qr ? 'Đã có' : '';
    $('#tVin').textContent = vin ? 'Đã có' : '';
    $('#tPhoto').textContent = photoIn ? 'Đã có' : '';
    $('#sQr').classList.toggle('done', !!qr);
    $('#sVin').classList.toggle('done', !!vin);
    $('#sPhoto').classList.toggle('done', !!photoIn);
    $('#saveIn').disabled = !(qr && vin && photoIn);
  }
  function refreshOut(){
    const qr = norm($('#outQr').value);
    $('#tQrOut').textContent = outRecord && outRecord.found && outRecord.status === 'Trong kho' ? 'Sẵn sàng xuất' : '';
    $('#sQrOut').classList.toggle('done', !!(outRecord && outRecord.found && outRecord.status === 'Trong kho'));
    $('#saveOut').disabled = !(qr && outRecord && outRecord.found && outRecord.status === 'Trong kho');
  }

  function setMode(m){
    mode = m;
    $('#tabIn').classList.toggle('on', m === 'in');
    $('#tabOut').classList.toggle('on', m === 'out');
    $('#viewIn').hidden = m !== 'in';
    $('#viewOut').hidden = m !== 'out';
    clearMsg();
  }
  $('#tabIn').onclick = () => setMode('in');
  $('#tabOut').onclick = () => setMode('out');

  /* ---------- nhập kho ---------- */
  $('#inQr').addEventListener('input', refreshIn);
  $('#inVin').addEventListener('input', refreshIn);

  $('#scanQr').onclick = async () => {
    const v = await scan('Hướng camera vào tem QR của xe');
    if (v){ $('#inQr').value = norm(v); refreshIn(); if (!norm($('#inVin').value)) $('#scanVin').focus(); }
  };
  $('#scanVin').onclick = async () => {
    const v = await scan('Hướng camera vào tem số khung');
    if (v){ $('#inVin').value = norm(v).toUpperCase(); refreshIn(); }
  };
  $('#shootIn').onclick = async () => {
    const p = await pickPhoto();
    if (p){
      photoIn = p;
      const im = $('#prevIn'); im.src = p; im.classList.add('show');
      refreshIn();
    }
  };

  $('#saveIn').onclick = async () => {
    const btn = $('#saveIn');
    const qr = norm($('#inQr').value), vin = norm($('#inVin').value).toUpperCase();
    btn.disabled = true; btn.textContent = 'Đang gửi...';
    clearMsg();
    try{
      const res = await api({action:'in', qr, vin, photo: photoIn.split(',')[1]});
      if (res.ok){
        addRecent('Nhập', qr, vin);
        showMsg('Đã nhập kho: ' + vin, 'ok');
        $('#inQr').value = ''; $('#inVin').value = '';
        photoIn = ''; $('#prevIn').classList.remove('show'); $('#prevIn').removeAttribute('src');
      } else {
        showMsg(res.error || 'Lỗi không rõ', 'err');
      }
    }catch(err){
      showMsg('Không gửi được: ' + err.message + '. Dữ liệu vẫn còn trên màn hình, bấm Lưu lại khi có mạng.', 'err');
    }
    btn.textContent = 'Lưu nhập kho';
    refreshIn();
  };

  /* ---------- xuất kho ---------- */
  async function lookup(){
    const qr = norm($('#outQr').value);
    outRecord = null;
    $('#outInfo').hidden = true;
    refreshOut();
    if (!qr) return;
    clearMsg();
    try{
      const res = await api({action:'lookup', qr});
      if (!res.ok){ showMsg(res.error || 'Lỗi tra cứu', 'err'); return; }
      outRecord = res;
      if (!res.found){
        showMsg('Tem QR này chưa được nhập kho.', 'err');
      } else {
        $('#oVin').textContent = res.vin;
        $('#oStatus').textContent = res.status;
        $('#oDate').textContent = res.dateIn || '';
        $('#outInfo').hidden = false;
        if (res.status !== 'Trong kho') showMsg('Xe này đã xuất kho' + (res.dateOut ? ' lúc ' + res.dateOut : '') + '.', 'warn');
      }
    }catch(err){
      showMsg('Không tra cứu được: ' + err.message, 'err');
    }
    refreshOut();
  }
  $('#outQr').addEventListener('change', lookup);
  $('#scanOut').onclick = async () => {
    const v = await scan('Hướng camera vào tem QR của xe cần xuất');
    if (v){ $('#outQr').value = norm(v); lookup(); }
  };
  $('#shootOut').onclick = async () => {
    const p = await pickPhoto();
    if (p){ photoOut = p; const im = $('#prevOut'); im.src = p; im.classList.add('show'); }
  };
  $('#saveOut').onclick = async () => {
    const btn = $('#saveOut');
    const qr = norm($('#outQr').value);
    btn.disabled = true; btn.textContent = 'Đang gửi...';
    clearMsg();
    try{
      const res = await api({action:'out', qr, note: norm($('#outNote').value), photo: photoOut ? photoOut.split(',')[1] : ''});
      if (res.ok){
        addRecent('Xuất', qr, res.vin || '');
        showMsg('Đã xuất kho: ' + (res.vin || qr), 'ok');
        $('#outQr').value = ''; $('#outNote').value = '';
        outRecord = null; $('#outInfo').hidden = true;
        photoOut = ''; $('#prevOut').classList.remove('show'); $('#prevOut').removeAttribute('src');
      } else {
        showMsg(res.error || 'Lỗi không rõ', 'err');
      }
    }catch(err){
      showMsg('Không gửi được: ' + err.message, 'err');
    }
    btn.textContent = 'Xác nhận xuất kho';
    refreshOut();
  };

  /* ---------- lịch sử trên máy ---------- */
  function addRecent(type, qr, vin){
    let list = [];
    try{ list = JSON.parse(store.get('recent') || '[]'); }catch(e){}
    const t = new Date();
    const hh = String(t.getHours()).padStart(2,'0') + ':' + String(t.getMinutes()).padStart(2,'0');
    list.unshift({type, qr, vin, hh});
    list = list.slice(0, 15);
    store.set('recent', JSON.stringify(list));
    renderRecent();
  }
  function renderRecent(){
    let list = [];
    try{ list = JSON.parse(store.get('recent') || '[]'); }catch(e){}
    $('#recent').hidden = !list.length;
    const ul = $('#recentList');
    ul.textContent = '';
    list.forEach(it => {
      const li = document.createElement('li');
      const b = document.createElement('b'); b.textContent = it.type;
      const sp = document.createElement('span'); sp.textContent = it.hh + '  ' + it.qr + (it.vin ? '  |  ' + it.vin : '');
      li.appendChild(b); li.appendChild(sp); ul.appendChild(li);
    });
  }

  /* ---------- cài đặt ---------- */
  const dlg = $('#settings');
  function openSettings(){
    $('#cfgUrl').value = store.get('url');
    $('#cfgSecret').value = store.get('secret');
    $('#cfgUser').value = store.get('user');
    $('#cfgMsg').textContent = '';
    dlg.showModal();
  }
  function saveSettings(){
    store.set('url', norm($('#cfgUrl').value));
    store.set('secret', norm($('#cfgSecret').value));
    store.set('user', norm($('#cfgUser').value));
  }
  $('#btnSettings').onclick = openSettings;
  $('#cfgSave').onclick = () => { saveSettings(); dlg.close(); };
  $('#cfgTest').onclick = async () => {
    saveSettings();
    $('#cfgMsg').textContent = 'Đang thử...';
    try{
      const res = await api({action:'ping'});
      $('#cfgMsg').textContent = res.ok ? 'Kết nối tốt.' : (res.error || 'Lỗi');
    }catch(err){
      $('#cfgMsg').textContent = 'Không kết nối được: ' + err.message;
    }
  };

  renderRecent();
  refreshIn();
  refreshOut();
  if (!store.get('url')) openSettings();
})();
</script>
</body>
</html>
